<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VIP Teen Patti Club</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #030804; color: #fff; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Modals */
    .overlay { position: fixed; inset: 0; background: rgba(3, 8, 4, 0.96); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; }
    .card-modal { background: #07170c; border: 2px solid #ffd700; border-radius: 16px; padding: 20px; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; align-items: center; box-shadow: 0 0 25px rgba(255, 215, 0, 0.2); }
    input { padding: 12px; border-radius: 8px; border: 1px solid #1e5230; background: #030804; color: #fff; width: 100%; text-align: center; font-size: 16px; font-weight: bold; }
    input:focus { border-color: #ffd700; outline: none; }
    .action-btn { padding: 12px; border: none; border-radius: 8px; background: linear-gradient(180deg, #ffd700, #b8860b); color: #000; font-weight: bold; cursor: pointer; width: 100%; font-size: 15px; box-shadow: 0 3px 6px rgba(0,0,0,0.4); }

    /* Top Bar */
    .top { padding: 8px 14px; background: #020503; display: flex; justify-content: space-between; align-items: center; z-index: 10; border-bottom: 2px solid #143d22; }
    .profile-badge { display: flex; align-items: center; gap: 8px; background: #092112; border: 1px solid #ffd700; padding: 4px 10px; border-radius: 20px; font-size: 12px; }
    .timer-badge { background: #d32f2f; color: #fff; padding: 3px 10px; border-radius: 12px; font-weight: bold; font-size: 12px; }

    /* 3D Casino Table */
    .table-box { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 210px; }
    .oval-table { 
      width: 95%; max-width: 480px; height: 390px; 
      background: radial-gradient(ellipse at center, #1b6336 0%, #0c3319 75%, #051c0d 100%); 
      border: 14px solid #28150a; border-radius: 140px; position: relative; 
      box-shadow: inset 0 0 40px rgba(0,0,0,0.9), 0 0 30px rgba(0,0,0,0.8); 
    }
    .oval-table::before { content: ''; position: absolute; inset: 4px; border: 2px dashed rgba(255,215,0,0.3); border-radius: 125px; pointer-events: none; }

    .pot-center { 
      position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%); 
      background: rgba(0,0,0,0.85); border: 2px solid #ffd700; padding: 8px 20px; 
      border-radius: 30px; text-align: center; z-index: 5; box-shadow: 0 0 15px rgba(255,215,0,0.4); 
    }

    /* Opponents Seats */
    .seat { position: absolute; width: 85px; text-align: center; transition: all 0.2s; }
    .seat.active .p-box { border-color: #ffd700; box-shadow: 0 0 16px #ffd700; transform: scale(1.05); }
    .p-box { background: rgba(0,0,0,0.8); border: 2px solid #333; border-radius: 10px; padding: 4px; font-size: 11px; }
    .mini-cards { display: flex; justify-content: center; gap: 2px; margin-top: 4px; }
    .mini-card { width: 22px; height: 32px; background: #fff; color: #000; border-radius: 3px; font-weight: bold; font-size: 10px; display: flex; align-items: center; justify-content: center; }
    .mini-card.back { background: repeating-linear-gradient(45deg, #1565c0, #1565c0 3px, #0d47a1 3px, #0d47a1 6px); color: #fff; }
    .mini-card.red { color: #d32f2f; }

    /* Dedicated Big Cards for Player (Raised slightly higher) */
    .my-hand-container {
      position: fixed; bottom: 125px; left: 0; right: 0;
      display: flex; justify-content: center; align-items: center; gap: 12px;
      z-index: 40; pointer-events: none;
    }
    .big-card {
      width: 62px; height: 92px; background: #fff; border-radius: 8px; color: #111;
      display: flex; flex-direction: column; justify-content: space-between; padding: 6px;
      font-weight: bold; font-size: 19px; box-shadow: 0 6px 16px rgba(0,0,0,0.9);
      user-select: none; border: 1px solid #ccc; pointer-events: auto;
    }
    .big-card.red { color: #d32f2f; }
    .big-card.card-back {
      background: repeating-linear-gradient(45deg, #b71c1c, #b71c1c 5px, #880e4f 5px, #880e4f 10px);
      border: 2px solid #fff; display: flex; align-items: center; justify-content: center;
    }
    .big-card.card-back::after { content: '♠'; color: rgba(255,255,255,0.7); font-size: 28px; }

    /* 3. Action Controls Shifted Upward (bottom: 24px) */
    .bottom-bar { 
      position: fixed; bottom: 24px; left: 10px; right: 10px; 
      background: rgba(4, 14, 7, 0.98); padding: 10px 8px; border-radius: 14px;
      border: 1.5px solid #23653b; display: flex; flex-direction: column; gap: 8px; z-index: 50; 
      box-shadow: 0 -4px 18px rgba(0,0,0,0.9);
    }
    .custom-chaal-row { display: flex; gap: 6px; align-items: center; justify-content: center; }
    .custom-chaal-row input { width: 95px; padding: 7px; font-size: 14px; text-align: center; }
    .chip-btn { padding: 7px 11px; border: 1px solid #ffd700; background: #13381e; color: #ffd700; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; }

    .btn-row { display: flex; gap: 6px; justify-content: center; }
    .btn { flex: 1; padding: 11px 0; border: none; border-radius: 7px; font-weight: bold; cursor: pointer; color: #fff; font-size: 11px; text-transform: uppercase; }
    .btn-see { background: linear-gradient(180deg, #29b6f6, #0288d1); }
    .btn-band { background: linear-gradient(180deg, #ab47bc, #7b1fa2); }
    .btn-counter { background: linear-gradient(180deg, #ff4081, #c2185b); }
    .btn-chaal { background: linear-gradient(180deg, #ffa726, #f57c00); font-size: 12px; }
    .btn-show { background: linear-gradient(180deg, #26a69a, #00796b); }
    .btn-pack { background: linear-gradient(180deg, #78909c, #455a64); }
    .btn:disabled { opacity: 0.22; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- STEP 1: Phone Number -->
  <div id="phoneOverlay" class="overlay">
    <div class="card-modal">
      <h2 style="color:#ffd700;">♠ REGISTER / LOGIN</h2>
      <p style="font-size:12px; color:#aaa; text-align:center;">Apna 10-digit mobile number dalein:</p>
      <input type="tel" id="userPhone" placeholder="Mobile Number" maxlength="10">
      <input type="text" id="userName" placeholder="Your Name">
      <button class="action-btn" onclick="sendOtpRequest()">GET OTP</button>
    </div>
  </div>

  <!-- STEP 2: OTP Verification -->
  <div id="otpOverlay" class="overlay" style="display:none;">
    <div class="card-modal">
      <h2 style="color:#ffd700;">ENTER OTP</h2>
      <p style="font-size:12px; color:#aaa; text-align:center;">Mobile par bheja gaya 4-digit code dalein:</p>
      <input type="number" id="otpInput" placeholder="4-Digit OTP" maxlength="4">
      <button class="action-btn" onclick="verifyOtpCode()">VERIFY & PLAY</button>
      <button class="action-btn" style="background:#444; color:#fff;" onclick="backToPhone()">CHANGE NUMBER</button>
    </div>
  </div>

  <!-- Table Join Lobby -->
  <div id="lobbyOverlay" class="overlay" style="display:none;">
    <div class="card-modal">
      <h2 style="color:#ffd700;">GAME LOBBY</h2>
      <div id="userStats" style="font-size:13px; text-align:center; line-height:1.5;"></div>
      <input type="text" id="roomCodeInput" placeholder="Room Code (e.g. 1001)">
      <button class="action-btn" onclick="enterRoom()">ENTER TABLE</button>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top">
    <div>Room: <b id="displayRoomId" style="color:#ffd700;">-</b></div>
    <div class="profile-badge">
      <span id="profileName">User</span> | <b>₹<span id="myWalletChips">500</span></b>
    </div>
    <div id="timerDisplay" class="timer-badge">⏳ 30s</div>
  </div>

  <!-- Oval Poker Table -->
  <div class="table-box">
    <div class="oval-table" id="tableSeats">
      <div class="pot-center">
        <div style="color:#ffd700; font-size:18px; font-weight:bold;">₹<span id="potAmount">0</span></div>
        <div style="font-size:10px; color:#aaa;">Bet: ₹<span id="betAmount">1</span></div>
      </div>
    </div>
  </div>

  <!-- Big Player Cards -->
  <div class="my-hand-container" id="myBigCards"></div>

  <!-- Upward Positioned Action Controls -->
  <div class="bottom-bar">
    <div class="custom-chaal-row">
      <button class="chip-btn" onclick="adjustChaal(1)">+1</button>
      <button class="chip-btn" onclick="adjustChaal(5)">+5</button>
      <button class="chip-btn" onclick="adjustChaal(10)">+10</button>
      <input type="number" id="customChaalInput" placeholder="Chaal">
      <button class="btn btn-chaal" style="flex: initial; padding: 7px 14px;" id="btnChaal" onclick="submitChaal()">CHAAL</button>
    </div>

    <div class="btn-row">
      <button class="btn btn-see" id="btnSee" onclick="sendAction('SEE')">SEE CARDS</button>
      <button class="btn btn-band" id="btnBand" onclick="sendAction('BAND')">BAND (2x)</button>
      <button class="btn btn-counter" id="btnCounter" onclick="sendAction('COUNTER')">COUNTER (3x)</button>
      <button class="btn btn-show" id="btnShow" onclick="triggerShow()">SHOW</button>
      <button class="btn btn-pack" id="btnPack" onclick="sendAction('PACK')">PACK</button>
    </div>
  </div>

  <script>
    const socket = io();
    let currentRoomId = null;
    let currentUser = null;
    let canShowGlobally = false;

    window.addEventListener('load', () => {
      let savedPhone = localStorage.getItem('tp_phone');
      let savedName = localStorage.getItem('tp_name');
      if (savedPhone) {
        document.getElementById('userPhone').value = savedPhone;
        if (savedName) document.getElementById('userName').value = savedName;
        socket.emit('verifyOtp', { phone: savedPhone, otp: '1234', name: savedName });
      }
    });

    function sendOtpRequest() {
      const phone = document.getElementById('userPhone').value.trim();
      if (phone.length !== 10) return alert('10-digit phone number dalein!');
      socket.emit('requestOtp', { phone });
    }

    socket.on('otpSent', ({ phone, otp }) => {
      alert(`📩 OTP for ${phone}: [ ${otp} ] (Testing Code: 1234)`);
      document.getElementById('phoneOverlay').style.display = 'none';
      document.getElementById('otpOverlay').style.display = 'flex';
    });

    function backToPhone() {
      document.getElementById('otpOverlay').style.display = 'none';
      document.getElementById('phoneOverlay').style.display = 'flex';
    }

    function verifyOtpCode() {
      const phone = document.getElementById('userPhone').value.trim();
      const name = document.getElementById('userName').value.trim();
      const otp = document.getElementById('otpInput').value.trim();
      if (!otp) return alert('OTP enter karein!');
      socket.emit('verifyOtp', { phone, otp, name });
    }

    socket.on('authError', (msg) => alert(msg));

    socket.on('authSuccess', (userData) => {
      currentUser = userData;
      localStorage.setItem('tp_phone', userData.phone);
      localStorage.setItem('tp_name', userData.name);

      document.getElementById('phoneOverlay').style.display = 'none';
      document.getElementById('otpOverlay').style.display = 'none';
      document.getElementById('lobbyOverlay').style.display = 'flex';

      document.getElementById('profileName').innerText = userData.name;
      document.getElementById('myWalletChips').innerText = userData.chips;

      let winRate = userData.gamesPlayed ? Math.round((userData.gamesWon / userData.gamesPlayed) * 100) : 0;
      document.getElementById('userStats').innerHTML = `
        <b style="color:#ffd700; font-size:16px;">${userData.name}</b><br>
        📱 ${userData.phone}<br>
        💰 Wallet Chips: <b>₹${userData.chips}</b><br>
        🎮 Games: <b>${userData.gamesPlayed}</b> | Won: <b>${userData.gamesWon}</b> (${winRate}%)
      `;

      let savedRoom = localStorage.getItem('tp_room');
      if (savedRoom) document.getElementById('roomCodeInput').value = savedRoom;
    });

    function enterRoom() {
      const roomId = document.getElementById('roomCodeInput').value.trim();
      if (!roomId) return alert('Room Code dalein!');
      localStorage.setItem('tp_room', roomId);
      currentRoomId = roomId;
      socket.emit('joinOrCreateRoom', { roomId, phone: currentUser.phone });
    }

    socket.on('errorMsg', (msg) => alert(msg));
    socket.on('playerMessage', (msg) => alert(msg));
    socket.on('timerUpdate', ({ timeLeft }) => {
      document.getElementById('timerDisplay').innerText = `⏳ ${timeLeft}s`;
    });

    socket.on('gameState', (state) => {
      currentRoomId = state.roomId;
      canShowGlobally = state.canShow;
      document.getElementById('displayRoomId').innerText = state.roomId;
      document.getElementById('lobbyOverlay').style.display = 'none';
      document.getElementById('potAmount').innerText = state.pot;
      document.getElementById('betAmount').innerText = state.currentBet;

      let chaalInput = document.getElementById('customChaalInput');
      if (!chaalInput.value || parseInt(chaalInput.value) <= state.currentBet) {
        chaalInput.value = state.currentBet + 1;
      }

      let activeP = state.players[state.activeIdx];
      let you = state.players.find(p => p.isYou);
      if (you) document.getElementById('myWalletChips').innerText = you.chips;

      let isYourTurn = you && activeP && activeP.id === you.id;

      document.getElementById('btnSee').disabled = !(isYourTurn && you.state === 'blind');
      document.getElementById('btnBand').disabled = !(isYourTurn && you.state === 'blind');
      document.getElementById('btnCounter').disabled = !(isYourTurn && you.state === 'blind' && state.lastMoveWasSeen);
      document.getElementById('btnChaal').disabled = !isYourTurn;
      document.getElementById('btnPack').disabled = !isYourTurn;
      
      // Show tabhi active hoga jab aapki turn ho aur dono player SEEN hon
      document.getElementById('btnShow').disabled = !(isYourTurn && state.canShow);

      renderTable(state.players, state.activeIdx);
      renderMyBigCards(you);
    });

    function triggerShow() {
      if (!canShowGlobally) {
        return alert('Show tabhi ho sakta hai jab aakhiri dono players Seen ho chuke hon!');
      }
      sendAction('SHOW');
    }

    function renderMyBigCards(you) {
      const container = document.getElementById('myBigCards');
      if (!you || you.folded) {
        container.innerHTML = '';
        return;
      }

      if (you.state === 'seen' && you.cards) {
        container.innerHTML = you.cards.map(c => {
          let isRed = c.suit === '♥' || c.suit === '♦';
          return `
            <div class="big-card ${isRed ? 'red':''}">
              <div>${c.rank}</div>
              <div style="font-size:26px; text-align:center;">${c.suit}</div>
              <div style="font-size:12px; text-align:right;">${c.rank}</div>
            </div>`;
        }).join('');
      } else {
        container.innerHTML = `
          <div class="big-card card-back"></div>
          <div class="big-card card-back"></div>
          <div class="big-card card-back"></div>
        `;
      }
    }

    function renderTable(players, activeIdx) {
      const container = document.getElementById('tableSeats');
      container.querySelectorAll('.seat').forEach(e => e.remove());

      const others = players.filter(p => !p.isYou);
      const total = others.length;

      others.forEach((p, i) => {
        const angle = (i / total) * Math.PI + Math.PI;
        const rx = 145, ry = 135;
        const x = 185 + rx * Math.cos(angle);
        const y = 150 + ry * Math.sin(angle);

        let cardHtml = p.cards 
          ? p.cards.map(c => `<div class="mini-card ${c.suit==='♥'||c.suit==='♦'?'red':''}">${c.rank}${c.suit}</div>`).join('')
          : `<div class="mini-card back">🂠</div><div class="mini-card back">🂠</div><div class="mini-card back">🂠</div>`;

        const seatDiv = document.createElement('div');
        seatDiv.className = `seat ${players[activeIdx]?.phone === p.phone ? 'active' : ''}`;
        seatDiv.style.left = `${x}px`;
        seatDiv.style.top = `${y}px`;
        seatDiv.innerHTML = `
          <div class="p-box">
            <b>${p.name}</b><br>
            ₹${p.chips} | <span style="color:#ffd700;">${p.folded ? 'FOLD' : p.state.toUpperCase()}</span>
          </div>
          <div class="mini-cards">${cardHtml}</div>
        `;
        container.appendChild(seatDiv);
      });
    }

    function adjustChaal(add) {
      let input = document.getElementById('customChaalInput');
      input.value = (parseInt(input.value) || 0) + add;
    }

    function submitChaal() {
      sendAction('CHAAL', parseInt(document.getElementById('customChaalInput').value));
    }

    function sendAction(type, amount) {
      socket.emit('action', { roomId: currentRoomId, phone: currentUser.phone, type, amount });
    }

    socket.on('gameOver', ({ message }) => alert(message));
    socket.on('showResult', (res) => {
      alert(`🏆 Winner: ${res.winnerName} won ₹${res.pot}!\n\n${res.p1.name}: ${res.p1.cards.map(c=>c.rank+c.suit).join(' ')} (Pt: ${res.p1.score})\n${res.p2.name}: ${res.p2.cards.map(c=>c.rank+c.suit).join(' ')} (Pt: ${res.p2.score})`);
    });
  </script>
</body>
</html>
