<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Teen Patti Live</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #07120a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    
    #joinOverlay { position: fixed; inset: 0; background: #0d1e13; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    input { padding: 12px; border-radius: 8px; border: 1px solid #2e7d32; background: #051009; color: #fff; width: 220px; text-align: center; font-size: 16px; }
    .action-btn { padding: 12px 24px; border: none; border-radius: 8px; background: #ffd700; color: #000; font-weight: bold; cursor: pointer; width: 220px; font-size: 15px; }

    .top { padding: 10px; background: #030a05; display: flex; justify-content: space-between; align-items: center; }
    .table-box { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
    .oval-table { width: 92%; max-width: 480px; height: 500px; background: radial-gradient(circle, #195e34, #0b2e18); border: 10px solid #3e2723; border-radius: 120px; position: relative; }
    .pot-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); border: 2px solid #ffd700; padding: 8px 16px; border-radius: 20px; text-align: center; }
    
    .seat { position: absolute; width: 90px; text-align: center; }
    .seat.active .p-box { border-color: #ffd700; box-shadow: 0 0 10px #ffd700; }
    .p-box { background: rgba(0,0,0,0.6); border: 2px solid #333; border-radius: 12px; padding: 4px; font-size: 11px; }
    .cards-box { display: flex; justify-content: center; gap: 3px; margin-top: 4px; }
    .card { width: 26px; height: 38px; background: #fff; color: #000; border-radius: 4px; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; }
    .card.back { background: #1565c0; color: #fff; }
    .card.red { color: #d32f2f; }
    
    .bottom-bar { background: #030a05; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .btn-row { display: flex; gap: 6px; justify-content: center; }
    .btn { flex: 1; max-width: 100px; padding: 10px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; font-size: 12px; }
    .btn-see { background: #0288d1; }
    .btn-band { background: #7b1fa2; }
    .btn-counter { background: #d32f2f; }
    .btn-chaal { background: #f57c00; }
    .btn-show { background: #00796b; }
    .btn-pack { background: #455a64; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  </style>
</head>
<body>

  <div id="joinOverlay">
    <h2 style="color:#ffd700;">♠ CUSTOM TEEN PATTI</h2>
    <input type="text" id="username" placeholder="Aapka Naam">
    <button class="action-btn" onclick="createRoom()">CREATE ROOM</button>
    <div style="color:#888;">--- YA ---</div>
    <input type="text" id="roomCodeInput" placeholder="Room Code">
    <button class="action-btn" style="background:#00e676;" onclick="joinRoom()">JOIN ROOM</button>
  </div>

  <div class="top">
    <div>Room: <b id="displayRoomId" style="color:#ffd700;">-</b></div>
    <div id="turnText" style="color:#00e676; font-weight:bold;">Waiting for players...</div>
  </div>

  <div class="table-box">
    <div class="oval-table" id="tableSeats">
      <div class="pot-center">
        <div style="color:#ffd700; font-size:18px; font-weight:bold;">₹<span id="potAmount">0</span></div>
        <div style="font-size:11px; color:#aaa;">Bet: ₹<span id="betAmount">1</span></div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="btn-row">
      <button class="btn btn-see" id="btnSee" onclick="sendAction('SEE')">SEE</button>
      <button class="btn btn-band" id="btnBand" onclick="sendAction('BAND')">BAND (2x)</button>
      <button class="btn btn-counter" id="btnCounter" onclick="sendAction('COUNTER')">COUNTER (3x)</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-pack" id="btnPack" onclick="sendAction('PACK')">PACK</button>
      <button class="btn btn-show" id="btnShow" onclick="sendAction('SHOW')">SHOW</button>
      <button class="btn btn-chaal" id="btnChaal" onclick="sendAction('CHAAL')">CHAAL</button>
    </div>
  </div>

  <script>
    const socket = io();
    let currentRoomId = null;

    function createRoom() {
      const name = document.getElementById('username').value.trim();
      if (!name) return alert('Naam daalein!');
      socket.emit('createRoom', { name });
    }

    function joinRoom() {
      const name = document.getElementById('username').value.trim();
      const roomId = document.getElementById('roomCodeInput').value.trim();
      if (!name || !roomId) return alert('Naam aur Room Code dono daalein!');
      socket.emit('joinRoom', { roomId, name });
    }

    socket.on('roomCreated', ({ roomId }) => {
      currentRoomId = roomId;
      document.getElementById('displayRoomId').innerText = roomId;
      document.getElementById('joinOverlay').style.display = 'none';
    });

    socket.on('errorMsg', (msg) => alert(msg));

    socket.on('gameState', (state) => {
      currentRoomId = state.roomId;
      document.getElementById('displayRoomId').innerText = state.roomId;
      document.getElementById('joinOverlay').style.display = 'none';
      document.getElementById('potAmount').innerText = state.pot;
      document.getElementById('betAmount').innerText = state.currentBet;

      let activeP = state.players[state.activeIdx];
      document.getElementById('turnText').innerText = `Turn: ${activeP.name}`;

      let you = state.players.find(p => p.isYou);
      let isYourTurn = you && state.players[state.activeIdx].id === you.id;

      document.getElementById('btnSee').disabled = !(isYourTurn && you.state === 'blind');
      document.getElementById('btnBand').disabled = !(isYourTurn && you.state === 'blind');
      document.getElementById('btnCounter').disabled = !(isYourTurn && you.state === 'blind' && state.lastMoveWasSeen);
      document.getElementById('btnChaal').disabled = !isYourTurn;
      document.getElementById('btnPack').disabled = !isYourTurn;
      document.getElementById('btnShow').disabled = !isYourTurn;
      document.getElementById('btnChaal').innerText = `CHAAL (₹${state.currentBet + 1})`;

      renderTable(state.players, state.activeIdx);
    });

    socket.on('gameOver', ({ message }) => alert(message));

    socket.on('showResult', (res) => {
      alert(`🏆 Winner: ${res.winnerName} won ₹${res.pot}!\n\n${res.p1.name}: ${res.p1.cards.map(c=>c.rank+c.suit).join(' ')} (Score: ${res.p1.score})\n${res.p2.name}: ${res.p2.cards.map(c=>c.rank+c.suit).join(' ')} (Score: ${res.p2.score})`);
    });

    function sendAction(type) {
      socket.emit('action', { roomId: currentRoomId, type });
    }

    function renderTable(players, activeIdx) {
      const container = document.getElementById('tableSeats');
      container.querySelectorAll('.seat').forEach(e => e.remove());

      const total = players.length;
      players.forEach((p, i) => {
        const angle = (i / total) * 2 * Math.PI + Math.PI/2;
        const rx = 160, ry = 190;
        const x = 190 + rx * Math.cos(angle);
        const y = 220 + ry * Math.sin(angle);

        let cardHtml = '';
        if (p.cards) {
          cardHtml = p.cards.map(c => {
            let isRed = c.suit === '♥' || c.suit === '♦';
            return `<div class="card ${isRed ? 'red':''}">${c.rank}${c.suit}</div>`;
          }).join('');
        } else {
          cardHtml = `<div class="card back">🂠</div><div class="card back">🂠</div><div class="card back">🂠</div>`;
        }

        const seatDiv = document.createElement('div');
        seatDiv.className = `seat ${i === activeIdx ? 'active' : ''}`;
        seatDiv.style.left = `${x}px`;
        seatDiv.style.top = `${y}px`;
        seatDiv.innerHTML = `
          <div class="p-box">
            <b>${p.name} ${p.isYou ? '(You)' : ''}</b><br>
            ₹${p.chips} | <span style="color:#ffd700;">${p.folded ? 'FOLD' : p.state.toUpperCase()}</span>
          </div>
          <div class="cards-box">${cardHtml}</div>
        `;
        container.appendChild(seatDiv);
      });
    }
  </script>
</body>
</html>
